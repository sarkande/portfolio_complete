<div class="skill-list">
  <div class="skill-list__search">
    <input
      type="text"
      [(ngModel)]="searchText"
      [placeholder]="'skillList.searchPlaceholder' | translate"
    />
  </div>

  <div class="technical-skills">
    <h2>{{ 'navbar.skill.technical' | translate }}</h2>
    <ng-container *ngFor="let skill of filteredSkills">
      <app-skill-card [skill]="skill" (click)="handleClickSkill(skill.name)"></app-skill-card>
    </ng-container>
  </div>
</div>
